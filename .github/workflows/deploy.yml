name: Deploy to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency: deploy
defaults:
  run:
    working-directory: app
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.PAGES_PROJECT || 'inspire-academy' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unpack the project from the zip
        working-directory: .
        run: |
          Z=$(ls *.zip 2>/dev/null | head -1)
          test -n "$Z" || { echo "Upload inspire-quiz-platform.zip to the repository first"; exit 1; }
          rm -rf /tmp/p app && mkdir /tmp/p && unzip -q "$Z" -d /tmp/p
          mv /tmp/p/* app
          test -f app/package.json || { echo "The zip does not contain the project"; exit 1; }
          ls app
      - name: Check secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Add the CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Add the CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
      - run: npm install --no-audit --no-fund
      - name: Database
        run: node scripts/ci-setup.mjs
      - name: Build
        run: npm run build
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply webapp-production --remote
      - name: Create the Pages project (first time only)
        run: npx wrangler pages project create "$PROJECT" --production-branch main || echo "Project already exists"
      - name: Settings and secrets
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          OPERATOR_NAME: ${{ secrets.OPERATOR_NAME }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          for NAME in ADMIN_EMAIL ADMIN_PASSWORD OPERATOR_NAME CONTACT_EMAIL; do
            VALUE="${!NAME}"
            if [ -n "$VALUE" ]; then printf '%s' "$VALUE" | npx wrangler pages secret put "$NAME" --project-name "$PROJECT" > /dev/null && echo "set $NAME"; fi
          done
      - name: Deploy
        run: npx wrangler pages deploy dist --project-name "$PROJECT" --branch main
      - name: Address
        run: echo "Your site is live at https://$PROJECT.pages.dev" | tee -a "$GITHUB_STEP_SUMMARY"
